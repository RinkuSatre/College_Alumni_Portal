{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - College Alumni Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white text-center">
                    <h2>Create Account</h2>
                    <p class="mb-0">College Alumni Portal</p>
                </div>

                <div class="card-body">

                    <form id="registerForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label>Full Name</label>
                                <input type="text" class="form-control" id="full_name" name="full_name">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Username</label>
                                <input type="text" class="form-control" id="username" name="username">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Email</label>
                                <input type="email" class="form-control" id="email" name="email">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Phone</label>
                                <input type="text" class="form-control" id="phone" name="phone">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Password</label>
                                <input type="password" class="form-control" id="password" name="password">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label>Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password">
                            </div>

                            <div class="col-md-6 mb-3" >
                                <label>Role</label>

                                <select class="form-select" id="role" name="role">
                                    <option value="">Select Role</option>
                                    <option value="student">Student</option>
                                    <option value="alumni">Alumni</option>
                                </select>

                            </div>

                        </div>

                        <!-- Student Fields -->
                        <div id="studentFields" style="display:none;">

                            <hr>

                            <h4 class="text-primary">Student Information</h4>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label>PRN Number</label>
                                    <input type="text" class="form-control" id="prn_number" name="prn_number">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Department</label>
                                    <input type="text" class="form-control" id="department" name="department">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Course</label>
                                    <input type="text" class="form-control" id="course" name="course">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Year</label>
                                    <input type="number" class="form-control" id="year" name="year">
                                </div>

                                <div class="col-md-12 mb-3">
                                    <label>Address</label>
                                    <textarea class="form-control" id="address" name="address"></textarea>
                                </div>

                                <div class="col-md-12 mb-3">
                                    <label>Profile Photo</label>
                                    <input type="file" class="form-control" id="profile_photo" name="profile_photo">
                                </div>

                            </div>

                        </div>

                        <!-- Alumni Fields -->
                        <div id="alumniFields" style="display:none;">

                            <hr>

                            <h4 class="text-success">Alumni Information</h4>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label>PRN Number</label>
                                    <input type="text" class="form-control" id="alumni_prn_number" name="prn_number">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Passout Year</label>
                                    <input type="number" class="form-control" id="passout_year" name="passout_year">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Company Name</label>
                                    <input type="text" class="form-control" id="company_name" name="company_name">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Job Title</label>
                                    <input type="text" class="form-control"  id="job_title" name="job_title">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Experience</label>
                                    <input type="number" class="form-control" id="experience" name="experience">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Current City</label>
                                    <input type="text" class="form-control"  id="current_city" name="current_city">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>LinkedIn</label>
                                    
                                    <input type="url" class="form-control" id="linkedin" name="linkedin" >
                                    
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Profile Photo</label>
                                    <input type="file" class="form-control"  id="alumni_profile_photo" name="alumni_profile_photo">
                                </div>

                                <div class="col-md-12 mb-3">
                                    <label>Bio</label>
                                    <textarea class="form-control" id="bio" name="bio"></textarea>
                                </div>

                            </div>

                        </div>

                        <button  type="submit" class="btn btn-success w-100 mt-3">
                            Register
                        </button>

                    </form>

                    <hr>

                    <p class="text-center">
                        Already have an account?
                        <a href="/login/">Login</a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
 const role = document.getElementById("role");

 role.addEventListener("change", function () {

    document.getElementById("studentFields").style.display = "none";
    document.getElementById("alumniFields").style.display = "none";

    if (this.value === "student") {
        document.getElementById("studentFields").style.display = "block";
     }

    if (this.value === "alumni") {
        document.getElementById("alumniFields").style.display = "block";
     }

 });

  document.getElementById("registerForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    if(password !== confirmPassword){
        alert("Passwords do not match!");
        return;
    }

    const data = {
      username: document.getElementById("username").value,
      email: document.getElementById("email").value,
      password: password,
      phone: document.getElementById("phone").value,
      role: document.getElementById("role").value,
      full_name: document.getElementById("full_name").value
    };

    if (data.role === "student") {

      data.prn_number = document.getElementById("prn_number").value;
      data.department = document.getElementById("department").value;
      data.course = document.getElementById("course").value;
      data.year = document.getElementById("year").value;
      data.address = document.getElementById("address").value;

    }

    if (data.role === "alumni") {

       data.prn_number = document.getElementById("alumni_prn_number").value;
       data.passout_year = document.getElementById("passout_year").value;
       data.company_name = document.getElementById("company_name").value;
       data.job_title = document.getElementById("job_title").value;
       data.experience = document.getElementById("experience").value;
       data.current_city = document.getElementById("current_city").value;
       data.linkedin = document.getElementById("linkedin").value;
       data.bio = document.getElementById("bio").value;

    }

    const response = await fetch("http://127.0.0.1:8000/api/accounts/register/",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    const result = await response.json();

    console.log(result);

    if(response.ok){
        alert("Registration Successful");
        window.location.href="/login/";
    }else{
        alert("Registration Failed");
        console.log(result);
    }

 });
</script>

</body>
</html>
