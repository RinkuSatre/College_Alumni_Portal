{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">College Alumni Portal</a>

        <div class="ms-auto">
            <a href="/" class="btn btn-light me-2">Home</a>
            <a href="/login/" class="btn btn-danger">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">
        Welcome Student 👋
    </h2>

    <div class="row">

        <div class="col-md-4 mb-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1>👤</h1>
                    <h4>My Profile</h4>
                    <a href="/student-profile/" class="btn btn-primary">
                        Open
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1>💼</h1>
                    <h4>Jobs</h4>
                    <a href="/jobs/" class="btn btn-success">
                        View Jobs
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1>📅</h1>
                    <h4>Events</h4>
                    <a href="/events/" class="btn btn-warning">
                        View Events
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1>💬</h1>
                    <h4>Forum</h4>
                    <a href="/forum/" class="btn btn-info">
                        Open Forum
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1>🏆</h1>
                    <h4>Reward Points</h4>
                    <h3 class="text-success">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h1>🔔</h1>
                    <h4>Notifications</h4>
                    <a href="/notifications/" class="btn btn-secondary">
                        View
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
